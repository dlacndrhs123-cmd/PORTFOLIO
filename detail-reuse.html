<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="REUSE 인테리어 디자인 포트폴리오. 기존 공간의 흔적을 남기는 공간 디자인 3장 슬라이드.">
  <title>REUSE | My portfolio</title>
  <link rel="stylesheet" href="./fonts/web_fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="./css/detail-reuse.css">
  <script defer src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script defer src="./js/detail-reuse.js"></script>
</head>
<body>
  <h1 class="sr-only">REUSE — 기존 공간의 흔적을 남기다</h1>
  <main class="reuse-portfolio" aria-label="REUSE 인테리어 디자인 포트폴리오">
    <div class="swiper reuse-swiper">
      <div class="swiper-wrapper">
        <section class="swiper-slide reuse-slide"><img class="reuse-artwork" src="./images/works/reuse/slide-1.png" width="2048" height="1152" alt="REUSE — 기존 공간의 흔적을 남기는 인테리어 콘셉트와 정면 공간 투시도" draggable="false" decoding="async"></section>
        <section class="swiper-slide reuse-slide"><img class="reuse-artwork" src="./images/works/reuse/slide-2.png" width="2047" height="1152" alt="REUSE 인테리어 디자인 — 카운터와 노출 콘크리트, 목재 마감 공간" draggable="false" decoding="async"></section>
        <section class="swiper-slide reuse-slide"><img class="reuse-artwork" src="./images/works/reuse/slide-3.png" width="2047" height="1152" alt="REUSE 인테리어 디자인 — 기존 구조와 벤치, 식물을 활용한 좌석 공간" draggable="false" decoding="async"></section>
      </div>
      <div class="reuse-pagination" aria-label="슬라이드 선택"></div>
    </div>
    <div class="reuse-controls">
      <button class="reuse-prev" type="button" aria-label="이전 슬라이드"><span aria-hidden="true">←</span></button>
      <button class="reuse-next" type="button" aria-label="다음 슬라이드"><span aria-hidden="true">→</span></button>
    </div>
    <p class="reuse-status" role="status" aria-live="polite">REUSE · 01 / 03</p>
    <noscript><p class="reuse-status">슬라이드를 보려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
  </main>
</body>
</html>
