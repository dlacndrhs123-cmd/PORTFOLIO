<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PRIVATE GOLF LOUNGE 인테리어 디자인 포트폴리오. 3장의 공간 투시도 슬라이드.">
  <title>PRIVATE GOLF LOUNGE | My portfolio</title>
  <link rel="stylesheet" href="./fonts/web_fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="./css/detail-private-golf-lounge.css">
  <script defer src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script defer src="./js/detail-private-golf-lounge.js"></script>
</head>
<body>
  <h1 class="sr-only">PRIVATE GOLF LOUNGE — 스포츠와 휴식이 공존하는 프라이빗 라이프스타일 공간</h1>
  <main class="golf-portfolio" aria-label="PRIVATE GOLF LOUNGE 인테리어 디자인 포트폴리오">
    <div class="swiper golf-swiper">
      <div class="swiper-wrapper">
        <section class="swiper-slide golf-slide"><img class="golf-artwork" src="./images/works/private-golf-lounge/1.png" width="1024" height="576" alt="PRIVATE GOLF LOUNGE 전체 공간과 실내 골프 존 투시도" draggable="false" decoding="async"></section>
        <section class="swiper-slide golf-slide"><img class="golf-artwork" src="./images/works/private-golf-lounge/2.png" width="480" height="270" alt="PRIVATE GOLF LOUNGE 우드 마감 바 카운터 공간 투시도" draggable="false" decoding="async"></section>
        <section class="swiper-slide golf-slide"><img class="golf-artwork" src="./images/works/private-golf-lounge/3.png" width="480" height="270" alt="PRIVATE GOLF LOUNGE 라운지와 미디어 공간 투시도" draggable="false" decoding="async"></section>
      </div>
      <div class="golf-pagination" aria-label="슬라이드 선택"></div>
    </div>
    <div class="golf-controls">
      <button class="golf-prev" type="button" aria-label="이전 슬라이드"><span aria-hidden="true">←</span></button>
      <button class="golf-next" type="button" aria-label="다음 슬라이드"><span aria-hidden="true">→</span></button>
    </div>
    <p class="golf-status" role="status" aria-live="polite">PRIVATE GOLF LOUNGE · 01 / 03</p>
  </main>
</body>
</html>
