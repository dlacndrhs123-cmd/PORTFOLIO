<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <!--파비콘-->
  <link rel="icon" href="./images/favicon.png">
  <!--외부스타일연결-->
  <link href="https://cdn.jsdelivr.net/npm/@xpressengine/xeicon@latest/xeicon.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css" />

  <!--내부스타일연결-->
  <link rel="stylesheet" href="./fonts/web_fonts.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/cms.css">
</head>

<body class="main-active">
  <header>
    <h1 id="title">My portfolio</h1>
    <nav id="gnb">
      <ul class="menu">
        <li class="btn">main</li>
        <li class="btn">about</li>
        <li class="btn">works</li>
        <li class="btn">contact</li>
      </ul>
    </nav>
  </header>

  <main id="wrap">
    <div class="container">
      <section id="main" class="section" aria-label="디자인 포트폴리오 메인">
        <div id="main_bg">
          <img id="back" src="./images/main/portfolio-cover.png" width="2048" height="1152"
            alt="PORTFOLIO — Design Portfolio, logo Design, interior Design, Graphic Design. 이메일: dlacndrhs123@gmail.com"
            fetchpriority="high" decoding="async">
        </div>
      </section>
      <section id="about" class="section" aria-label="디자이너 소개와 연혁">
        <div class="about-wrap">
          <img class="about-image" src="./images/about/portfolio-about.png" width="2047" height="1151"
            alt="기억에 남고, 경험으로 이어지는 디자인. 임충곤의 기본정보, 자격증, 학력사항, 활동이력과 사용 프로그램을 소개하는 포트폴리오."
            decoding="async">
        </div>
      </section>
      <section id="works" class="section">
        <!--works(portfolio):작업한 프로젝트들을 진열하고, 
          소개 및 설명(기획)을 첨부하고, 모달윈도우를 통해
          세부페이지로 연결-->
        <div class="work-header">
          <div class="title-area">
            <p class="sub-label">Selected Atelier Works</p>
            <h2 class="main-title">Crafted Archive</h2>
          </div>
          <div class="scroll-guide">
            Scroll / Drag to browse &rarr;
          </div>
        </div>

        <div id="works_inner">
          <div class="list" aria-live="polite"></div>
          <template id="work-card-template">
            <div class="item">
              <a class="work-card" data-fancybox="portfolio" data-type="iframe">
                <div class="thumb-box"><img alt=""></div>
                <div class="meta-info">
                  <div class="top-row"><span class="index-num"></span><span class="category-stamp"></span></div>
                  <h3 class="project-title"></h3>
                  <p class="project-desc"></p>
                </div>
              </a>
            </div>
          </template>
          <p id="works-status" role="status" hidden></p>

        </div><!--end:#works_inner-->
      </section>

      <section id="contact" class="section">
        <div class="guestbook-wrap swiper-no-swiping">
          <p>contact : 맨 마지막 영역으로 생략해도 됨.
            (끝인사, 맺음말, 연락수단(연락처), 방명록,
            메일전송화면)</p>
          <form id="guestbook-form" action="/api/guestbook" method="post">
            <h2>Leave a Message</h2>
            <p class="guestbook-note">메시지는 관리자에게 전달되며 공개 GitHub 저장소에 저장됩니다. 연락처 등 개인정보는 남기지 마세요.</p>
            <label for="guestbook-name">Name</label>
            <input id="guestbook-name" name="name" autocomplete="nickname" maxlength="40" required>
            <label for="guestbook-message">Message</label>
            <textarea id="guestbook-message" name="message" rows="4" maxlength="500" required></textarea>
            <div class="guestbook-honeypot" aria-hidden="true">
              <label for="guestbook-website">Website</label>
              <input id="guestbook-website" name="website" tabindex="-1" autocomplete="off">
            </div>
            <div id="guestbook-turnstile"></div>
            <button type="submit" disabled>Leave a Message</button>
            <p id="guestbook-status" role="status" aria-live="polite">방명록을 준비하고 있습니다.</p>
          </form>
        </div>
      </section>
    </div><!--end:.container-->
    <div class="pager"></div>
    <div class="navi">
      <div class="prev"><i class="xi-4x xi-caret-up-square-o"></i></div>
      <div class="next"><i class="xi-4x xi-caret-down-square-o"></i></div>
    </div>
  </main>

  <!--외부스크립트-->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.umd.js"></script>
  <!--내부스크립트-->
  <script src="./js/script.js"></script>
  <script src="./js/cms.js"></script>
</body>

</html>
