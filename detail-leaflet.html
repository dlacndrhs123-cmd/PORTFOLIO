<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="여주빛한의원 로고 브랜딩 디자인 포트폴리오. 브랜드 아이덴티티와 응용 디자인을 담은 슬라이드.">
  <title>여주빛한의원 | Logo Branding Design</title>
  <link rel="stylesheet" href="./fonts/web_fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="./css/detail-cardnews.css">
  <script defer src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script defer src="./js/detail-leaflet.js"></script>
</head>
<body>
  <h1 class="sr-only">여주빛한의원 — Logo Branding Design</h1>
  <main class="branding-portfolio" aria-label="여주빛한의원 로고 브랜딩 디자인 포트폴리오">
    <div class="swiper branding-swiper">
      <div class="swiper-wrapper">
        <section class="swiper-slide branding-slide">
          <img class="branding-artwork" src="./images/works/leaflet/slide-1.png" width="1672" height="941" alt="여주빛한의원 브랜드 아이덴티티, 로고 디자인, 브랜드 컬러와 응용 디자인 보드" draggable="false" decoding="async">
        </section>
      </div>
      <div class="branding-pagination" aria-label="슬라이드 선택"></div>
    </div>
    <div class="branding-controls">
      <button class="branding-prev" type="button" aria-label="이전 슬라이드"><span aria-hidden="true">←</span></button>
      <button class="branding-next" type="button" aria-label="다음 슬라이드"><span aria-hidden="true">→</span></button>
    </div>
    <p class="branding-status" role="status" aria-live="polite">여주빛한의원 · 01 / 01</p>
  </main>
</body>
</html>
