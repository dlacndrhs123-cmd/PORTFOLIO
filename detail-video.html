<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="유튜브 영상 편집 포트폴리오. 채널별 작업을 살펴보는 4장 슬라이드.">
  <title>VIDEO Editing | My portfolio</title>
  <link rel="stylesheet" href="./fonts/web_fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="./css/detail-video.css">
  <script defer src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script defer src="./js/detail-video.js"></script>
</head>
<body>
  <header class="video-header"><h1>My portfolio_VIDEO Editing</h1></header>
  <main class="video-portfolio" aria-label="영상 편집 포트폴리오">
    <div class="swiper video-swiper">
      <div class="swiper-wrapper"></div>
    </div>
    <template id="video-slide-template">
      <section class="swiper-slide video-slide">
        <div class="video-sidebar">
          <div class="video-title-group"><h2></h2><p class="video-subtitle"></p></div>
          <img class="video-profile" width="200" height="200" alt="" draggable="false">
        </div>
        <div class="video-main"><img width="1350" height="920" alt="" draggable="false"></div>
      </section>
    </template>
    <div class="video-controls">
      <button class="video-prev" type="button" aria-label="이전 프로젝트"><span aria-hidden="true">←</span></button>
      <div class="video-pagination" aria-label="프로젝트 선택"></div>
      <button class="video-next" type="button" aria-label="다음 프로젝트"><span aria-hidden="true">→</span></button>
    </div>
    <p class="video-status" role="status" aria-live="polite">프로젝트를 불러오고 있습니다.</p>
    <noscript><p class="video-status">슬라이드를 보려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
  </main>
</body>
</html>
